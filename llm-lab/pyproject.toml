[project]
name = "llmlab"
version = "0.1.0"
description = "Experiments in building, fine-tuning and calibrating LLMs"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch>=2.8",
    "transformers>=5.0",
    "accelerate",
    "datasets",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "tqdm",
    "flash-linear-attention>=0.5.2",
]

[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmlab"]

# CUDA 12.8 wheels match the vs-c1/vs-c2 driver (570, CUDA 12.8)
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
